# Legacy Smithery build config. Smithery now distributes local stdio servers as an
# MCPB bundle (see manifest.json); this file is kept for older tooling only.
startCommand:
  type: stdio
  configSchema:
    type: object
    required:
      - tiktoolsApiKey
    properties:
      tiktoolsApiKey:
        type: string
        title: tik.tools API key
        description: Get a key at https://tik.tools/pricing (Sandbox is a 7-day evaluation, no credit card)
  commandFunction: |
    (config) => ({
      command: 'node',
      args: ['src/index.js'],
      env: {
        TIKTOOLS_API_KEY: config.tiktoolsApiKey
      }
    })
